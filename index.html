<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke House - Interactive Store Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');
        
        :root {
            --ph-bg: #FDF6E9;
            --ph-blue-dark: #1E3A5F;
            --ph-blue: #00A3B5;
            --ph-pink: #FF85A2;
            --ph-text: #1E3A5F;
            --ph-white: #FFFFFF;
        }

        body, html {
            margin: 0; padding: 0; font-family: 'Montserrat', sans-serif;
            height: 100%; background-color: var(--ph-bg); color: var(--ph-text);
        }

        /* Container principale */
        .container { display: flex; height: 100vh; flex-direction: row; position: relative; overflow: hidden; }

        .map-wrapper {
            flex: 6; height: 100%; position: relative; background-color: #B5D0D0; border-right: 4px solid var(--ph-text);
        }
        #map { width: 100%; height: 100%; z-index: 1; }
        .leaflet-layer { filter: sepia(0.2) saturate(1.2); }

        .sidebar {
            flex: 4; padding: 30px 20px; background-color: var(--ph-bg); overflow-y: auto;
            box-sizing: border-box; display: flex; flex-direction: column; z-index: 2; position: relative; height: 100%;
        }
        .sidebar::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%23E5C79E" opacity="0.4"/></svg>');
            pointer-events: none; z-index: -1;
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 5px; text-transform: uppercase; color: var(--ph-text); letter-spacing: -0.5px; }
        .header h2 { font-size: 16px; font-weight: 600; color: var(--ph-pink); margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        .filters { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .filters input, .filters select {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 2px solid var(--ph-text);
            font-family: 'Montserrat', sans-serif; font-size: 15px; font-weight: 600; color: var(--ph-text);
            background-color: var(--ph-white); outline: none; box-shadow: 4px 4px 0px rgba(30,58,95,0.1); box-sizing: border-box; transition: all 0.2s;
        }
        .filters input:focus, .filters select:hover { box-shadow: 2px 2px 0px rgba(30,58,95,0.2); transform: translate(2px, 2px); }
        .filters input::placeholder { color: #A0B2C4; font-weight: 500; }

        .store-card {
            display: none; animation: fadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative;
            text-align: center; margin-bottom: 20px;
        }
        .store-card.active { display: flex; flex-direction: column; align-items: center; }

        .card-graphic {
            width: 100%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(30,58,95,0.15);
            margin-bottom: 20px; border: 2px solid rgba(30,58,95,0.05); object-fit: contain; background-color: white;
        }

        .btn-video {
            display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; max-width: 400px;
            background-color: var(--ph-text); color: var(--ph-white); text-decoration: none; padding: 16px;
            border-radius: 14px; font-weight: 700; font-size: 16px; transition: all 0.2s; box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(30,58,95,0.2); margin-bottom: 30px;
        }
        .btn-video:hover { background-color: var(--ph-pink); transform: translateY(-2px); }

        .placeholder-card {
            text-align: center; padding: 40px 30px; color: var(--ph-text); opacity: 0.6; font-weight: 600;
            font-size: 18px; line-height: 1.5; border: 3px dashed rgba(30,58,95,0.2); border-radius: 20px;
        }

        .custom-ph-marker {
            width: 32px; height: 42px; background-size: contain; background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 32 42" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 0C7.163 0 0 7.163 0 16C0 26.5 16 42 16 42C16 42 32 26.5 32 16C32 7.163 24.837 0 16 0Z" fill="%23FF85A2"/><circle cx="16" cy="15" r="7" fill="white"/></svg>');
            filter: drop-shadow(0px 5px 4px rgba(0,0,0,0.3)); transition: transform 0.2s;
        }
        .custom-ph-marker:hover { transform: scale(1.15) translateY(-5px); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Correzioni Mobile */
        @media (max-width: 768px) {
            .container { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
            .map-wrapper { flex: none; height: 45vh; min-height: 350px; border-right: none; border-bottom: 4px solid var(--ph-text); }
            .sidebar { flex: none; height: auto; padding: 20px 15px; overflow-y: visible; }
            body, html { overflow: auto; height: auto; }
            .card-graphic { max-width: 100%; height: auto; }
            .header h1 { font-size: 26px; }
            .btn-video { margin-bottom: 20px; }
        }
        
        .leaflet-popup { max-width: 260px; }
        .leaflet-popup-content-wrapper { border-radius: 12px; font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--ph-text); }
        .leaflet-popup-content b { color: var(--ph-pink); text-transform: uppercase; font-size: 14px; }
        .leaflet-popup-content .popup-address { font-size: 12px; margin-top: 5px; opacity: 0.8; line-height: 1.3; }
    </style>
</head>

        { "name": "VARESE", "slug": "varese", "city": "VARESE", "region": "Lombardia", "lat": 45.48721, "lng": 9.20726, "card_image": "./cards/varese.png", "docebo_url": "https://phacademy.poke-house.com/learn/courses/786/varese", "indirizzo": "Via Carlo Giuseppe Veratti, 4, 21100 Varese VA" },
        { "name": "VERONA", "slug": "verona", "city": "VERONA", "region": "Veneto", "lat": 45.43407, "lng": 10.99006, "card_image": "./cards/verona.png", "docebo_url": "https://phacademy.poke-house.com/pages/32/catalogo-corsi?course_code=ALLABOUTUS_VERONA", "indirizzo": "Largo Guido Gonella, 1, 37121 Verona VR" }
    ];

    const italyBounds = [[36.0, 6.5], [47.5, 18.5]];

    const map = L.map('map', {
        zoomControl: true, 
        scrollWheelZoom: true, 
        minZoom: 5, // Abbassato per permettere la visione completa su mobile
        maxZoom: 15,
        maxBounds: italyBounds, 
        maxBoundsViscosity: 1.0 
    });
    
    // Auto-adatta lo zoom allo schermo (PC o Telefono)
    map.fitBounds(italyBounds);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri', maxZoom: 16
    }).addTo(map);

    fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: function(feature) {
                    const name = feature.properties.reg_name || "";
                    let regionColor = '#FFE1E8'; 
                    if(name.includes('Lombardia') || name.includes('Toscana') || name.includes('Sicilia')) regionColor = '#F4A261'; 
                    else if(name.includes('Piemonte') || name.includes('Campania') || name.includes('Lazio')) regionColor = '#FF85A2'; 
                    else if(name.includes('Veneto') || name.includes('Puglia')) regionColor = '#2A9D8F'; 
                    else if(name.includes('Emilia')) regionColor = '#E9C46A'; 
                    else if(name.includes('Sardegna')) regionColor = '#FDF6E9'; 
                    else if(name.includes('Calabria') || name.includes('Liguria')) regionColor = '#8AB17D'; 
                    else if(name.includes('Umbria') || name.includes('Marche')) regionColor = '#F9C784'; 
                    return { color: '#1E3A5F', weight: 1.5, fillColor: regionColor, fillOpacity: 0.8 };
                }
            }).addTo(map);
        })
        .catch(() => console.log("GeoJSON confini non caricato."));

    const phIcon = L.divIcon({ className: 'custom-ph-marker', iconSize: [32, 42], iconAnchor: [16, 42], popupAnchor: [0, -40] });
    const markers = []; 

    stores.forEach(store => {
        const marker = L.marker([store.lat, store.lng], {icon: phIcon}).addTo(map);
        
        marker.bindPopup(`<b>${store.name}</b><br>${store.city}<div class="popup-address">${store.indirizzo}</div>`);
        
        marker.on('mouseover', function(e) {
            this.openPopup();
        });
        
        marker.on('click', () => {
            document.getElementById('storeSelect').value = store.slug;
            showStoreDetails(store, marker);
        });
        
        markers.push({marker, store});
    });

    const searchBar = document.getElementById('searchBar');
    const storeSelect = document.getElementById('storeSelect');

    function populateDropdown(storeList) {
        storeSelect.innerHTML = '<option value="all">📍 Seleziona uno store...</option>';
        storeList.forEach(store => {
            const option = document.createElement('option');
            option.value = store.slug;
            option.textContent = `${store.city} - ${store.name}`;
            storeSelect.appendChild(option);
        });
    }
    
    populateDropdown(stores);

    searchBar.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredStores = stores.filter(s => 
            s.city.toLowerCase().includes(query) || 
            s.name.toLowerCase().includes(query) ||
            s.indirizzo.toLowerCase().includes(query)
        );
        
        populateDropdown(filteredStores);

        const bounds = [];
        markers.forEach(m => {
            map.removeLayer(m.marker);
            if (filteredStores.includes(m.store)) {
                m.marker.addTo(map);
                bounds.push([m.store.lat, m.store.lng]);
            }
        });
        
        if (bounds.length > 0 && query !== '') {
            map.fitBounds(bounds, {padding: [50, 50], maxZoom: 12});
        } else if (query === '') {
            map.fitBounds(italyBounds);
        }
        
        document.getElementById('placeholderCard').style.display = 'block';
        document.getElementById('storeCard').classList.remove('active');
        map.closePopup();
    });

    storeSelect.addEventListener('change', (e) => {
        const selectedSlug = e.target.value;
        if (selectedSlug === 'all') {
            document.getElementById('placeholderCard').style.display = 'block';
            document.getElementById('storeCard').classList.remove('active');
            map.fitBounds(italyBounds);
            map.closePopup();
        } else {
            const selectedStore = stores.find(s => s.slug === selectedSlug);
            const m = markers.find(m => m.store.slug === selectedSlug);
            if (selectedStore && m) {
                showStoreDetails(selectedStore, m.marker);
            }
        }
    });

    function showStoreDetails(store, markerObject) {
        document.getElementById('placeholderCard').style.display = 'none';
        const card = document.getElementById('storeCard'); 
        card.classList.remove('active'); 
        
        setTimeout(() => {
            document.getElementById('cardGraphicFull').src = store.card_image;
            document.getElementById('cardLink').href = store.docebo_url;
            
            card.classList.add('active');
            
            const offset = window.innerWidth > 768 ? -0.01 : 0;
            map.setView([store.lat, store.lng + offset], 15, {animate: true, duration: 0.5});
            if(markerObject) markerObject.openPopup();
            
            if (window.innerWidth <= 768) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            
        }, 50);
    }
</script>
